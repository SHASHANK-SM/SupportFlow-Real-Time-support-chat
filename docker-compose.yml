services:
  mongodb:
    image: mongo:7
    volumes: [mongo_data:/data/db]
    healthcheck: {test: [CMD, mongosh, --eval, "db.adminCommand('ping')"], interval: 10s, timeout: 5s, retries: 5}
  backend:
    build: ./server
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/support_chat
      JWT_SECRET: ${JWT_SECRET:-change-this-before-production}
      JWT_EXPIRES_IN: 1d
      CLIENT_URL: http://localhost:5173
    ports: ["5000:5000"]
    depends_on: {mongodb: {condition: service_healthy}}
    healthcheck: {test: [CMD, node, -e, "fetch('http://localhost:5000/api/health').then(r=>process.exit(r.ok?0:1))"], interval: 15s, timeout: 5s, retries: 5}
  frontend:
    build: ./client
    ports: ["5173:80"]
    depends_on: [backend]
volumes: {mongo_data: {}}
